<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=block">
<style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#4b3be0}
.c{position:relative;width:512px;height:512px;background:#4b3be0}
/* a 2x2 crossword corner: clue cell with arrow + three letter cells, the big Ç sits in the first letter cell */
.cell{position:absolute;border-radius:34px}
.clue{left:76px;top:76px;width:112px;height:112px;background:#6d5ff0}
.clue::after{content:"";position:absolute;right:16px;top:50%;transform:translateY(-50%);border:20px solid transparent;border-left-color:#ffc66e;border-right-width:0}
.big{left:204px;top:76px;width:232px;height:232px;background:#ffffff;display:grid;place-items:center;font:800 196px/1 Manrope,system-ui,sans-serif;color:#4b3be0;padding-bottom:30px;box-sizing:border-box}
.d1{left:76px;top:204px;width:112px;height:232px;background:#6d5ff0}
.d1::after{content:"";position:absolute;bottom:18px;left:50%;transform:translateX(-50%);border:20px solid transparent;border-top-color:#ffc66e;border-bottom-width:0}
.s1{left:204px;top:324px;width:108px;height:112px;background:#ffc66e}
.s2{left:328px;top:324px;width:108px;height:112px;background:#ffffff;opacity:.35}
</style></head><body><div class="c">
<div class="cell clue"></div><div class="cell d1"></div><div class="cell big">Ç</div><div class="cell s1"></div><div class="cell s2"></div>
</div></body></html>
